# Checks every change and builds the extension zip. Pushing a tag like v1.0.2 also publishes a
# release, so the README's download link always serves a zip built from this repo's own code.
name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: chatsearch
          path: release/chatsearch.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/chatsearch.zip --title "$GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA."
